name: dojodex_instructor
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # state management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # manager
  get_it: ^7.7.0

  # Internationalisation
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # utils
  provider: ^6.1.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  mutex: ^3.1.0
  logger: ^2.4.0
  faker: ^2.2.0
  dio: ^5.7.0
  pretty_dio_logger: ^1.2.0-beta-1
  http: ^1.2.2
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  sqflite: ^2.4.0
  path_provider: ^2.1.5

  # ui
  flutter_slidable: ^3.1.1
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0+3
  fluttertoast: ^8.2.8
  pull_to_refresh_flutter3: ^2.0.2
  path: ^1.9.0
  internet_connection_checker_plus: ^2.7.1

  # services
  #

  # animations
  animated_text_kit: ^4.2.2
  lottie: ^3.1.3

  # database
  sembast: ^3.7.5
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.8.3

  # Utilities
  envied: ^1.1.1

  # icons
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8

  # mono repo
  dojodex_common:
    path: ../dojodex_common

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.15
  envied_generator: ^1.1.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lotties/
    - assets/splash/
    - assets/icon/
    - assets/svgs/
    - assets/images/

flutter_intl:
  enabled: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app-icon.png"
  image_path_ios: "assets/icon/app-icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app-icon.png"
